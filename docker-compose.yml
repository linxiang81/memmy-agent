services:
  memmy:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    environment:
      MEMMY_MEMORY_HOST: 127.0.0.1
      MEMMY_MEMORY_PORT: 18961
      MEMORY_SERVICE_TOKEN: ${MEMORY_SERVICE_TOKEN}

    volumes:
      - memmy-data:/data

    ports:
      - "18960:18960"
      
  memmy-proxy:
    image: nginx:alpine
    restart: unless-stopped

    network_mode: "service:memmy"

    depends_on:
      - memmy

    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/nginx.conf <<'EOF'
        events {}

        http {
            server {
                listen 18960;

                location / {
                    proxy_pass http://127.0.0.1:18961;

                    proxy_set_header Host 127.0.0.1:18961;
                    proxy_set_header Origin http://127.0.0.1:18961;
                    proxy_set_header Referer http://127.0.0.1:18961/;

                    proxy_http_version 1.1;
                }
            }
        }
        EOF

        exec nginx -g 'daemon off;'
