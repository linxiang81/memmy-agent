services:
  memmy:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      MEMMY_MEMORY_HOST: 127.0.0.1
      MEMMY_MEMORY_PORT: 18961
      MEMORY_SERVICE_TOKEN: ${MEMORY_SERVICE_TOKEN}

    volumes:
      - memmy-data:/data

    # 对外开放的是 nginx 的 18960
    ports:
      - "18960:18960"

  memmy-proxy:
    image: nginx:alpine
    restart: unless-stopped

    # 与 memmy 共用 network namespace
    # 这样 nginx 可以访问 127.0.0.1:18961
    network_mode: "service:memmy"

    depends_on:
      - memmy

    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/nginx.conf <<'EOF'
        events {}

        http {
            server {
                listen 18960;

                location / {
                    proxy_pass http://127.0.0.1:18961;

                    # Memmy Viewer 要求 Host 必须是 loopback
                    proxy_set_header Host 127.0.0.1:18961;

                    proxy_http_version 1.1;

                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
        }
        EOF

        exec nginx -g 'daemon off;'

volumes:
  memmy-data:
